name: 30 Signal Monitor

on:
  workflow_run:
    workflows: ["20 Manager Loop"]
    types: [completed]
  workflow_dispatch:

jobs:
  signal-monitor:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download latest institutional data artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching latest successful 00-data-fetch run ..."
          DATA_RUN_ID=$(gh run list \
            --workflow=00-data-fetch.yml \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -z "$DATA_RUN_ID" ]; then
            echo "ERROR: Could not find a successful 00-data-fetch run"
            exit 1
          fi
          echo "Downloading artifact from run $DATA_RUN_ID"
          gh run download "$DATA_RUN_ID" \
            --name "institutional-data-${DATA_RUN_ID}" \
            --dir data/

      - name: Run Signal Monitor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/monitor/signal_monitor.py

      - name: Upload monitor report
        uses: actions/upload-artifact@v4
        with:
          name: monitor-report-${{ github.run_id }}
          path: data/monitor/
          retention-days: 90
