name: 11 Screener Setup B

on:
  workflow_run:
    workflows: ["00 Data Fetch"]
    types: [completed]

jobs:
  guardrail:
    uses: ./.github/workflows/99-guardrail-check.yml
    with:
      max_candidates: ${{ vars.MAX_CANDIDATES_PER_RUN || '5' }}
      data_fetch_run_id: ${{ github.event.workflow_run.id }}

  screener-setup-b:
    runs-on: ubuntu-latest
    needs: guardrail
    permissions:
      contents: read
      issues: write
      actions: write
    if: ${{ github.event.workflow_run.conclusion == 'success' && needs.guardrail.outputs.passed == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Step 1 - Download latest institutional data artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -n "$DATA_RUN_ID" ]; then
            echo "Using triggering 00-data-fetch run ID: $DATA_RUN_ID"
          else
            echo "Fetching latest successful 00-data-fetch run ..."
            DATA_RUN_ID=$(gh run list \
              --workflow=00-data-fetch.yml \
              --status=success \
              --limit=1 \
              --json databaseId \
              --jq '.[0].databaseId')
          fi
          if [ -z "$DATA_RUN_ID" ]; then
            echo "ERROR: Could not find a successful 00-data-fetch run"
            exit 1
          fi
          echo "Downloading artifact from run $DATA_RUN_ID"
          gh run download "$DATA_RUN_ID" \
            --name "institutional-data-${DATA_RUN_ID}" \
            --dir data/

      - name: Step 2 - Run Setup B screener
        env:
          MAX_CANDIDATES_PER_RUN: ${{ vars.MAX_CANDIDATES_PER_RUN || '5' }}
          FOREIGN_10D_DIRECTION_THRESHOLD: ${{ vars.FOREIGN_10D_DIRECTION_THRESHOLD || '0.05' }}
        run: |
          python scripts/screener/setup_b.py

      - name: Step 3 - Create GitHub Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROJECT_NUMBER: ${{ vars.GH_PROJECT_NUMBER }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python scripts/screener/create_issues.py data/screener/screener_result_b_*.json

      - name: Step 4 - Upload screener artifacts
        uses: actions/upload-artifact@v4
        with:
          name: screener-b-${{ github.run_id }}
          path: data/screener/
          retention-days: 90
