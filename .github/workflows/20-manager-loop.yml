name: 20 Manager Loop

on:
  workflow_run:
    workflows: ["10 Screener Setup A"]
    types: [completed]
  workflow_dispatch:

jobs:
  guardrail:
    uses: ./.github/workflows/99-guardrail-check.yml

  manager-loop:
    runs-on: ubuntu-latest
    needs: guardrail
    permissions:
      contents: read
      issues: write
      actions: write
    if: ${{ github.event_name == 'workflow_dispatch' || (needs.guardrail.outputs.passed == 'true' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Manager Loop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/manager/manager_loop.py

      - name: Upload manager report
        uses: actions/upload-artifact@v4
        with:
          name: manager-report-${{ github.run_id }}
          path: data/manager/
          retention-days: 90
