name: 00 Data Fetch

on:
  schedule:
    - cron: "0 12 * * 1-5"   # 台灣時間 20:00，UTC 12:00
  workflow_dispatch:            # 允許手動觸發（測試用）

jobs:
  guardrail:
    uses: ./.github/workflows/99-guardrail-check.yml
    with:
      skip_rolling_check: true

  data-fetch:
    runs-on: ubuntu-latest
    needs: guardrail
    if: ${{ needs.guardrail.outputs.passed == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Step 1 - Restore historical raw data
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          PREVIOUS_RUN_ID=$(gh run list \
            --workflow=00-data-fetch.yml \
            --branch=${{ github.ref_name }} \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId')
          EXIT_CODE=$?
          set -e

          if [ -z "$PREVIOUS_RUN_ID" ] || [ "$EXIT_CODE" -ne 0 ]; then
            echo "first_run=true" >> "$GITHUB_OUTPUT"
            echo "First run or no previous successful run found"
            exit 0
          fi

          echo "Found previous successful run: $PREVIOUS_RUN_ID"
          set +e
          gh run download "$PREVIOUS_RUN_ID" \
            --name "institutional-data-${PREVIOUS_RUN_ID}" \
            --dir data/
          DOWNLOAD_EXIT=$?
          set -e

          if [ "$DOWNLOAD_EXIT" -ne 0 ]; then
            echo "first_run=true" >> "$GITHUB_OUTPUT"
            echo "Failed to download previous artifact"
            exit 0
          fi

          if [ -d "data/raw" ]; then
            RESTORED_COUNT=$(find data/raw -name '*.json' 2>/dev/null | wc -l)
            echo "first_run=false" >> "$GITHUB_OUTPUT"
            echo "Restored ${RESTORED_COUNT} raw files from previous artifact (run ${PREVIOUS_RUN_ID})"
          else
            echo "first_run=true" >> "$GITHUB_OUTPUT"
            echo "Previous artifact does not contain expected data/raw directory"
          fi

      - name: Step 2 - Fetch institutional data
        run: |
          if [ "${{ steps.restore.outputs.first_run }}" == "true" ]; then
            echo "First run, backfilling 25 days"
            python scripts/data/fetch_institutional.py --backfill-days 25
          else
            echo "Restoring from previous artifact, backfilling up to 5 days"
            python scripts/data/fetch_institutional.py --backfill-days 5
          fi

      - name: Step 3 - Compute rolling metrics
        run: |
          python scripts/data/compute_rolling.py

      - name: Step 4 - Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: institutional-data-${{ github.run_id }}
          path: data/
          retention-days: 90

      - name: Step 5 - Trigger downstream Screener workflows
        # TODO: Replace with gh workflow run once Screener workflows exist.
        run: |
          echo "Downstream trigger placeholder: replace with workflow_dispatch to Screener workflows"
