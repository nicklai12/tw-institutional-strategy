name: 99 Guardrail Check

on:
  workflow_call:
    inputs:
      skip_rolling_check:
        description: "是否跳過 rolling JSON 日期檢查（給 00-data-fetch 使用）"
        required: false
        type: boolean
        default: false
      max_candidates:
        description: "Setup A 每日最大候選數量"
        required: false
        type: string
        default: "5"
      data_fetch_run_id:
        description: "指定的 00-data-fetch run ID（避免 gh run list 查到舊 run）"
        required: false
        type: string
        default: ""
    outputs:
      passed:
        description: "Guardrail 是否通過"
        value: ${{ jobs.guardrail.outputs.passed }}
      screener_done:
        description: "今日 Setup A 是否已執行完畢"
        value: ${{ jobs.guardrail.outputs.screener_done }}

jobs:
  guardrail:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.check.outputs.passed }}
      screener_done: ${{ steps.check.outputs.screener_done }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download latest institutional data artifact
        if: ${{ inputs.skip_rolling_check == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.data_fetch_run_id }}" ]; then
            DATA_RUN_ID="${{ inputs.data_fetch_run_id }}"
            echo "Using specified 00-data-fetch run ID: $DATA_RUN_ID"
          else
            echo "Fetching latest successful 00-data-fetch run ..."
            DATA_RUN_ID=$(gh run list \
              --workflow=00-data-fetch.yml \
              --status=success \
              --limit=1 \
              --json databaseId \
              --jq '.[0].databaseId')
          fi
          if [ -z "$DATA_RUN_ID" ]; then
            echo "ERROR: Could not find a successful 00-data-fetch run"
            exit 1
          fi
          echo "Downloading artifact from run $DATA_RUN_ID"
          gh run download "$DATA_RUN_ID" \
            --name "institutional-data-${DATA_RUN_ID}" \
            --dir data/

      - name: Run guardrail check
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_ROLLING_CHECK: ${{ inputs.skip_rolling_check }}
          MAX_CANDIDATES_PER_RUN: ${{ inputs.max_candidates }}
        run: |
          python scripts/guardrail/pre_run_check.py

      - name: Upload guardrail report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardrail-report-${{ github.run_id }}
          path: data/guardrail/
          retention-days: 90
